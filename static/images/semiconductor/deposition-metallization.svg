<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" font-family="sans-serif">
  <rect width="850" height="310" fill="#f8fafc" rx="8"/>
  <text x="425" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">薄膜沉积 &amp; 金属化：构建晶体管之上的"城市立交"</text>
  <text x="425" y="43" text-anchor="middle" font-size="10" fill="#64748b">CVD 沉积绝缘层 / PVD 溅射金属 / 电镀铜 — BEOL 后端工艺</text>

  <!-- ===== CVD ===== -->
  <rect x="15" y="55" width="260" height="240" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="145" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">CVD 化学气相沉积</text>

  <!-- Chamber -->
  <rect x="50" y="90" width="190" height="80" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="145" y="105" text-anchor="middle" font-size="7" fill="#166534">反应腔体 (300~900°C)</text>
  <!-- Gas in -->
  <text x="55" y="120" font-size="6" fill="#64748b">SiH₄</text>
  <text x="220" y="120" font-size="6" fill="#64748b">O₂</text>
  <line x1="70" y1="125" x2="100" y2="140" stroke="#86efac" stroke-width="0.8"/>
  <line x1="220" y1="125" x2="190" y2="140" stroke="#86efac" stroke-width="0.8"/>
  <!-- Wafer in chamber -->
  <rect x="105" y="145" width="80" height="15" fill="#bfdbfe" rx="1"/>
  <text x="145" y="156" text-anchor="middle" font-size="6" fill="#1e3a5f">晶圆</text>

  <text x="145" y="185" text-anchor="middle" font-size="8" fill="#166534">气态前驱体 → 固态薄膜</text>
  <text x="145" y="200" text-anchor="middle" font-size="8" fill="#166534">SiH₄ + O₂ → SiO₂ + 2H₂</text>

  <text x="145" y="225" text-anchor="middle" font-size="8" fill="#166534">沉积材料：</text>
  <text x="145" y="242" text-anchor="middle" font-size="8" fill="#64748b">SiO₂, Si₃N₄, 多晶硅</text>
  <text x="145" y="258" text-anchor="middle" font-size="8" fill="#64748b">low-k 介质 (减小寄生电容)</text>

  <!-- Arrow -->
  <polygon points="280,175 305,165 280,155 305,175" fill="#94a3b8"/>

  <!-- ===== PVD ===== -->
  <rect x="315" y="55" width="240" height="240" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="435" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">PVD 物理气相沉积</text>

  <!-- Sputtering chamber -->
  <rect x="335" y="90" width="200" height="75" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="435" y="105" text-anchor="middle" font-size="7" fill="#1e40af">溅射腔体 (真空)</text>
  <!-- Target -->
  <rect x="360" y="112" width="150" height="10" fill="#9ca3af" rx="2"/>
  <text x="435" y="121" text-anchor="middle" font-size="6" fill="#4b5563">靶材 (Al/Cu/Ti/TiN)</text>
  <!-- Ar plasma -->
  <circle cx="380" cy="138" r="3" fill="#818cf8" opacity="0.5"/>
  <circle cx="420" cy="140" r="3" fill="#818cf8" opacity="0.5"/>
  <circle cx="460" cy="137" r="3" fill="#818cf8" opacity="0.5"/>
  <circle cx="400" cy="145" r="3" fill="#818cf8" opacity="0.5"/>
  <circle cx="440" cy="148" r="3" fill="#818cf8" opacity="0.5"/>
  <text x="435" y="143" text-anchor="middle" font-size="6" fill="#6366f1">Ar⁺ 等离子体</text>
  <!-- Wafer -->
  <rect x="375" y="152" width="120" height="10" fill="#bfdbfe" rx="1"/>
  <text x="435" y="160" text-anchor="middle" font-size="6" fill="#1e3a5f">晶圆</text>

  <text x="435" y="180" text-anchor="middle" font-size="8" fill="#1e40af">Ar⁺ 轰击靶材 → 原子溅射到晶圆</text>
  <text x="435" y="198" text-anchor="middle" font-size="8" fill="#64748b">用途：阻挡层 (TiN/TaN)</text>
  <text x="435" y="214" text-anchor="middle" font-size="8" fill="#64748b">      籽晶层 (Cu seed)</text>
  <text x="435" y="230" text-anchor="middle" font-size="8" fill="#64748b">      金属栅极 (TiAl)</text>

  <!-- Arrow -->
  <polygon points="560,175 585,165 560,155 585,175" fill="#94a3b8"/>

  <!-- ===== CMP + Electroplating ===== -->
  <rect x="600" y="55" width="235" height="240" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <text x="717" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#a16207">CMP &amp; 电镀</text>

  <text x="635" y="105" font-size="8" fill="#a16207" font-weight="bold">CMP 化学机械抛光</text>
  <text x="635" y="120" font-size="8" fill="#64748b">化学腐蚀 + 机械研磨</text>
  <text x="635" y="135" font-size="8" fill="#64748b">→ 全局平坦化</text>
  <text x="635" y="150" font-size="8" fill="#64748b">→ 每层金属前必须抛光</text>

  <text x="635" y="180" font-size="8" fill="#a16207" font-weight="bold">电镀铜 (ECD)</text>
  <text x="635" y="197" font-size="8" fill="#64748b">• 在沟槽中电镀铜填充</text>
  <text x="635" y="213" font-size="8" fill="#64748b">• 铜 = 低电阻率</text>
  <text x="635" y="229" font-size="8" fill="#64748b">• 大马士革工艺 (Damascene)</text>

  <!-- Cross-section -->
  <rect x="680" y="245" width="100" height="40" fill="#e0f2fe" rx="2"/>
  <rect x="685" y="248" width="90" height="15" fill="#bfdbfe" rx="1"/>
  <rect x="685" y="263" width="90" height="18" fill="#fbbf24" opacity="0.5" rx="1"/>
  <text x="730" y="258" text-anchor="middle" font-size="6" fill="#1e3a5f">SiO₂</text>
  <text x="730" y="275" text-anchor="middle" font-size="6" fill="#92400e">Cu</text>
  <text x="790" y="268" font-size="6" fill="#a16207">多层互连</text>
</svg>