<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="semi" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="insul" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">导体 · 半导体 · 绝缘体</text>

  <!-- Column: 导体 -->
  <rect x="40" y="60" width="210" height="300" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="145" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">导 体</text>
  <text x="145" y="112" text-anchor="middle" font-size="11" fill="#64748b">（铜、铝、金等）</text>

  <!-- Free electrons flowing -->
  <rect x="65" y="130" width="160" height="30" rx="4" fill="url(#metal)" opacity="0.9"/>
  <text x="145" y="150" text-anchor="middle" font-size="13" fill="white" font-weight="bold">自由电子极多</text>

  <line x1="65" y1="180" x2="225" y2="180" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="85" cy="180" r="4" fill="#2563eb"/>
  <circle cx="110" cy="180" r="4" fill="#2563eb"/>
  <circle cx="140" cy="180" r="4" fill="#2563eb"/>
  <circle cx="170" cy="180" r="4" fill="#2563eb"/>
  <circle cx="200" cy="180" r="4" fill="#2563eb"/>
  <text x="145" y="200" text-anchor="middle" font-size="11" fill="#475569">电子可自由移动</text>

  <!-- Vertical moving electrons -->
  <circle cx="85" cy="240" r="4" fill="#2563eb" opacity="0.6"/>
  <circle cx="120" cy="250" r="4" fill="#2563eb" opacity="0.6"/>
  <circle cx="155" cy="235" r="4" fill="#2563eb" opacity="0.6"/>
  <circle cx="190" cy="245" r="4" fill="#2563eb" opacity="0.6"/>

  <rect x="65" y="265" width="160" height="30" rx="4" fill="#bfdbfe"/>
  <text x="145" y="285" text-anchor="middle" font-size="11" fill="#1e40af">导电能力：★★★★★</text>

  <text x="145" y="330" text-anchor="middle" font-size="12" fill="#64748b">加电压 → 电流导通</text>

  <!-- Column: 半导体 -->
  <rect x="290" y="60" width="220" height="300" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">半 导 体</text>
  <text x="400" y="112" text-anchor="middle" font-size="11" fill="#64748b">（硅 Si、锗 Ge 等）</text>

  <rect x="315" y="130" width="170" height="30" rx="4" fill="url(#semi)" opacity="0.9"/>
  <text x="400" y="150" text-anchor="middle" font-size="13" fill="white" font-weight="bold">自由电子极少（本征）</text>

  <!-- Covalent bond structure -->
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="#475569">硅原子共价键结构</text>
  <circle cx="400" cy="210" r="14" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="214" text-anchor="middle" font-size="10" fill="#92400e">Si</text>
  <!-- Bonds -->
  <line x1="386" y1="210" x2="356" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="414" y1="210" x2="444" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="196" x2="400" y2="166" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="224" x2="400" y2="254" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="275" text-anchor="middle" font-size="11" fill="#475569">电子被束缚在键中</text>

  <rect x="315" y="288" width="170" height="30" rx="4" fill="#fef3c7"/>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#92400e">掺杂后可控制导电</text>

  <text x="400" y="340" text-anchor="middle" font-size="12" fill="#64748b">可通过掺杂/电场控制</text>

  <!-- Column: 绝缘体 -->
  <rect x="550" y="60" width="210" height="300" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="655" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">绝 缘 体</text>
  <text x="655" y="112" text-anchor="middle" font-size="11" fill="#64748b">（玻璃、塑料、橡胶）</text>

  <rect x="575" y="130" width="160" height="30" rx="4" fill="url(#insul)" opacity="0.9"/>
  <text x="655" y="150" text-anchor="middle" font-size="13" fill="white" font-weight="bold">几乎没有自由电子</text>

  <!-- Locked electrons -->
  <circle cx="615" cy="185" r="10" fill="none" stroke="#ef4444" stroke-width="2"/>
  <circle cx="615" cy="185" r="4" fill="#ef4444"/>
  <line x1="615" y1="175" x2="615" y2="195" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="605" y1="185" x2="625" y2="185" stroke="#ef4444" stroke-width="1.5"/>

  <circle cx="655" cy="185" r="10" fill="none" stroke="#ef4444" stroke-width="2"/>
  <circle cx="655" cy="185" r="4" fill="#ef4444"/>
  <line x1="655" y1="175" x2="655" y2="195" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="645" y1="185" x2="665" y2="185" stroke="#ef4444" stroke-width="1.5"/>

  <circle cx="695" cy="185" r="10" fill="none" stroke="#ef4444" stroke-width="2"/>
  <circle cx="695" cy="185" r="4" fill="#ef4444"/>
  <line x1="695" y1="175" x2="695" y2="195" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="685" y1="185" x2="705" y2="185" stroke="#ef4444" stroke-width="1.5"/>

  <text x="655" y="225" text-anchor="middle" font-size="11" fill="#475569">电子都被锁在</text>
  <text x="655" y="240" text-anchor="middle" font-size="11" fill="#475569">原子/分子内部</text>

  <rect x="575" y="265" width="160" height="30" rx="4" fill="#fecaca"/>
  <text x="655" y="285" text-anchor="middle" font-size="11" fill="#991b1b">导电能力：☆☆☆☆☆</text>

  <text x="655" y="330" text-anchor="middle" font-size="12" fill="#64748b">加电压 → 不导通</text>
</svg>