<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
  <rect width="800" height="520" fill="#f8fafc" rx="8"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">光刻工艺：芯片制造的核心步骤</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#64748b">原理类似冲洗照片，"底片"是光罩，"相纸"是涂了光刻胶的晶圆</text>

  <!-- ===== Step 1: Coat Photoresist ===== -->
  <rect x="20" y="60" width="240" height="135" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="140" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">① 涂光刻胶</text>

  <!-- Wafer cross-section -->
  <rect x="60" y="95" width="160" height="25" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="112" text-anchor="middle" font-size="8" fill="#475569">硅衬底</text>

  <rect x="60" y="120" width="160" height="12" rx="2" fill="#f59e0b" opacity="0.6"/>
  <text x="140" y="129" text-anchor="middle" font-size="7" fill="#92400e">光刻胶</text>

  <!-- Spinner arrow -->
  <path d="M100,140 Q100,160 140,160 Q180,160 180,140" fill="none" stroke="#d97706" stroke-width="1"/>
  <text x="140" y="175" text-anchor="middle" font-size="9" fill="#78716c">旋涂 → 均匀薄层</text>

  <!-- Arrow to next -->
  <line x1="260" y1="127" x2="285" y2="127" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="285,127 278,122 278,132" fill="#94a3b8"/>

  <!-- ===== Step 2: Exposure ===== -->
  <rect x="290" y="60" width="240" height="135" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="410" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">② 曝光</text>

  <!-- UV light from top -->
  <line x1="410" y1="86" x2="410" y2="100" stroke="#0ea5e9" stroke-width="1.5"/>
  <line x1="395" y1="88" x2="410" y2="100" stroke="#0ea5e9" stroke-width="1.5"/>
  <line x1="425" y1="88" x2="410" y2="100" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="470" y="96" font-size="8" fill="#0369a1">紫外光/EUV</text>

  <!-- Photomask -->
  <rect x="330" y="100" width="160" height="10" rx="1" fill="#64748b" opacity="0.8"/>
  <rect x="355" y="100" width="50" height="10" fill="#e2e8f0" opacity="0.3"/>
  <text x="410" y="108" text-anchor="middle" font-size="7" fill="white">光掩模（光罩）</text>

  <!-- Substrate + photoresist -->
  <rect x="340" y="112" width="140" height="18" rx="2" fill="#cbd5e1"/>
  <rect x="340" y="130" width="140" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>

  <!-- Exposed vs unexposed -->
  <rect x="365" y="130" width="40" height="10" rx="1" fill="#fbbf24" opacity="0.9"/>
  <text x="385" y="154" text-anchor="middle" font-size="8" fill="#0369a1">透光处胶变性</text>

  <text x="410" y="174" text-anchor="middle" font-size="9" fill="#78716c">光罩图案 → 光刻胶</text>

  <!-- Arrow to next -->
  <line x1="530" y1="127" x2="555" y2="127" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="555,127 548,122 548,132" fill="#94a3b8"/>

  <!-- ===== Step 3: Development ===== -->
  <rect x="560" y="60" width="220" height="135" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="670" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">③ 显影</text>

  <!-- After development: exposed area dissolved -->
  <rect x="600" y="95" width="140" height="18" rx="2" fill="#cbd5e1"/>
  <rect x="600" y="113" width="40" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="658" y="113" width="82" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>
  <!-- Gap where exposed area was -->
  <rect x="640" y="113" width="18" height="10" rx="1" fill="#cbd5e1"/>

  <text x="670" y="145" text-anchor="middle" font-size="9" fill="#166534">显影液洗去曝光部分</text>
  <text x="670" y="160" text-anchor="middle" font-size="9" fill="#78716c">图案显现</text>

  <!-- Big arrow down to next row -->
  <line x1="400" y1="198" x2="400" y2="230" stroke="#64748b" stroke-width="2"/>
  <polygon points="400,230 394,220 406,220" fill="#64748b"/>

  <!-- ===== Step 4: Etching ===== -->
  <rect x="20" y="235" width="240" height="135" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="140" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">④ 刻蚀</text>

  <!-- Before etching -->
  <rect x="60" y="275" width="160" height="18" rx="2" fill="#cbd5e1"/>
  <rect x="60" y="293" width="40" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="118" y="293" width="82" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="100" y="293" width="18" height="10" rx="1" fill="#cbd5e1"/>

  <!-- Down arrow for etching -->
  <polygon points="105,308 95,318 115,318" fill="#ef4444"/>
  <polygon points="105,313 97,322 113,322" fill="#ef4444"/>
  <polygon points="105,318 99,326 111,326" fill="#ef4444"/>

  <!-- After etching -->
  <rect x="60" y="330" width="160" height="18" rx="2" fill="#cbd5e1"/>
  <rect x="60" y="330" width="40" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="118" y="330" width="82" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>
  <!-- Etched trench -->
  <rect x="100" y="322" width="18" height="18" rx="1" fill="#fecaca"/>

  <text x="140" y="368" text-anchor="middle" font-size="9" fill="#991b1b">等离子体吃掉裸露氧化层</text>

  <!-- Arrow to next -->
  <line x1="260" y1="302" x2="285" y2="302" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="285,302 278,297 278,307" fill="#94a3b8"/>

  <!-- ===== Step 5: Strip PR ===== -->
  <rect x="290" y="235" width="240" height="135" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="410" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">⑤ 去胶</text>

  <!-- Before strip -->
  <rect x="330" y="275" width="160" height="18" rx="2" fill="#cbd5e1"/>
  <rect x="330" y="275" width="42" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>
  <rect x="370" y="275" width="18" height="18" rx="1" fill="#fecaca"/>
  <rect x="392" y="275" width="98" height="10" rx="1" fill="#f59e0b" opacity="0.6"/>

  <!-- Strip arrow -->
  <text x="410" y="310" text-anchor="middle" font-size="20" fill="#a78bfa">↓</text>

  <!-- After strip -->
  <rect x="330" y="325" width="160" height="18" rx="2" fill="#cbd5e1"/>
  <rect x="368" y="325" width="18" height="18" rx="1" fill="#cbd5e1"/>

  <text x="410" y="368" text-anchor="middle" font-size="9" fill="#6d28d9">洗掉残余光刻胶</text>

  <!-- Arrow to next -->
  <line x1="530" y1="302" x2="555" y2="302" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="555,302 548,297 548,307" fill="#94a3b8"/>

  <!-- ===== Result ===== -->
  <rect x="560" y="235" width="220" height="135" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="3"/>
  <text x="670" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">✓ 图形转移完成</text>

  <rect x="600" y="275" width="140" height="45" rx="3" fill="#cbd5e1" stroke="#86efac" stroke-width="2"/>
  <rect x="618" y="280" width="18" height="35" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="654" y="280" width="18" height="35" rx="2" fill="#94a3b8" opacity="0.5"/>

  <text x="670" y="342" text-anchor="middle" font-size="10" fill="#166534">氧化层图案 = 光罩图案</text>
  <text x="670" y="358" text-anchor="middle" font-size="9" fill="#64748b">一层光刻完成</text>

  <!-- Bottom summary -->
  <rect x="60" y="390" width="680" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="413" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">光刻是芯片制造的「分辨率瓶颈」</text>
  <text x="400" y="438" text-anchor="middle" font-size="12" fill="#475569">7nm / 5nm / 3nm 这个数字，指的就是光刻能做出的最小特征尺寸</text>
  <text x="400" y="462" text-anchor="middle" font-size="12" fill="#475569">EUV（极紫外光，波长 13.5nm）是实现 7nm 以下工艺的关键技术</text>
  <text x="400" y="486" text-anchor="middle" font-size="12" fill="#475569">一台 ASML EUV 光刻机售价约 1.5~2 亿美元，全球仅 ASML 能生产</text>
</svg>