<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="sans-serif">
  <rect width="1000" height="700" fill="#f8fafc" rx="8"/>
  <text x="500" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">掺杂 (Doping)：离子注入 &amp; 退火激活</text>
  <text x="500" y="48" text-anchor="middle" font-size="11" fill="#64748b">精确控制杂质原子进入硅晶格的深度和浓度 — 形成 PN 结、调整阈值电压</text>

  <!-- ==================== PANEL 1: ION IMPLANTER ==================== -->
  <rect x="10" y="60" width="480" height="300" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="10" y="60" width="480" height="30" rx="6" fill="#bfdbfe"/>
  <text x="250" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">① 离子注入机原理</text>

  <!-- Ion source -->
  <rect x="20" y="105" width="90" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="126" text-anchor="middle" font-size="8" fill="#1e40af" font-weight="bold">离子源</text>
  <text x="65" y="142" text-anchor="middle" font-size="7" fill="#3b82f6">BF₃/PH₃/AsH₃</text>
  <text x="65" y="152" text-anchor="middle" font-size="6" fill="#64748b">气体离化</text>

  <!-- Arrow from source -->
  <polygon points="110,130 125,125 125,135" fill="#3b82f6"/>
  <line x1="110" y1="130" x2="125" y2="130" stroke="#3b82f6" stroke-width="2"/>

  <!-- Mass analyzer (magnet) -->
  <rect x="130" y="100" width="100" height="60" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="180" y="122" text-anchor="middle" font-size="8" fill="#92400e" font-weight="bold">质量分析磁铁</text>
  <text x="180" y="138" text-anchor="middle" font-size="7" fill="#b45309">E×B 速度筛选</text>
  <text x="180" y="152" text-anchor="middle" font-size="6" fill="#64748b">只让目标离子通过</text>

  <!-- Arrow -->
  <polygon points="230,130 245,125 245,135" fill="#3b82f6"/>
  <line x1="230" y1="130" x2="245" y2="130" stroke="#3b82f6" stroke-width="2"/>

  <!-- Acceleration tube -->
  <rect x="250" y="105" width="85" height="50" rx="5" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="292" y="122" text-anchor="middle" font-size="8" fill="#9d174d" font-weight="bold">加速管</text>
  <text x="292" y="138" text-anchor="middle" font-size="7" fill="#be185d">1keV~3MeV</text>
  <text x="292" y="152" text-anchor="middle" font-size="6" fill="#64748b">决定注入深度</text>

  <!-- Arrow -->
  <polygon points="335,130 350,125 350,135" fill="#3b82f6"/>
  <line x1="335" y1="130" x2="350" y2="130" stroke="#3b82f6" stroke-width="2"/>

  <!-- Beam scanning -->
  <rect x="355" y="105" width="40" height="50" rx="5" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="375" y="128" text-anchor="middle" font-size="7" fill="#4b5563">扫描</text>
  <text x="375" y="142" text-anchor="middle" font-size="6" fill="#6b7280">X-Y偏转</text>

  <!-- Target chamber -->
  <rect x="30" y="180" width="310" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="185" y="200" text-anchor="middle" font-size="9" fill="#334155" font-weight="bold">靶室 (Target Chamber) — 真空 10⁻⁷ Torr</text>

  <!-- Wafer stage -->
  <rect x="80" y="215" width="110" height="18" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <text x="135" y="228" text-anchor="middle" font-size="7" fill="#475569">晶圆台 (可旋转/倾斜)</text>
  <line x1="135" y1="233" x2="135" y2="250" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Ion beam hitting wafer -->
  <line x1="375" y1="155" x2="135" y2="222" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="255" y="192" text-anchor="middle" font-size="7" fill="#3b82f6">离子束</text>

  <!-- Faraday cup -->
  <rect x="240" y="240" width="80" height="20" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="280" y="254" text-anchor="middle" font-size="7" fill="#6d28d9">法拉第杯 (剂量监测)</text>

  <!-- Key points -->
  <text x="20" y="295" font-size="9" fill="#475569" font-weight="bold">▸ 关键控制参数:</text>
  <text x="25" y="312" font-size="8" fill="#64748b">• 能量 (Energy): 决定注入深度 → 低能(~10keV)浅结 / 高能(~MeV)深阱</text>
  <text x="25" y="328" font-size="8" fill="#64748b">• 剂量 (Dose): 决定掺杂浓度 → 10¹¹~10¹⁶ ions/cm²</text>
  <text x="25" y="344" font-size="8" fill="#64748b">• 注入角度: 通常 7° 倾斜防止沟道效应</text>

  <!-- ==================== PANEL 2: DOPING PROFILE ==================== -->
  <rect x="510" y="60" width="480" height="300" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="510" y="60" width="480" height="30" rx="6" fill="#fef08a"/>
  <text x="750" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">② 掺杂深度分布 (高斯分布)</text>

  <!-- Graph axes -->
  <line x1="560" y1="280" x2="950" y2="280" stroke="#64748b" stroke-width="1.5"/>
  <line x1="560" y1="100" x2="560" y2="280" stroke="#64748b" stroke-width="1.5"/>
  <text x="755" y="298" text-anchor="middle" font-size="8" fill="#475569">深度 (Depth, nm)</text>
  <text x="555" y="195" text-anchor="middle" font-size="8" fill="#475569" transform="rotate(-90,555,195)">浓度 log(N/cm³)</text>

  <!-- X axis labels -->
  <text x="610" y="295" text-anchor="middle" font-size="7" fill="#64748b">0</text>
  <text x="690" y="295" text-anchor="middle" font-size="7" fill="#64748b">Rp₁</text>
  <text x="850" y="295" text-anchor="middle" font-size="7" fill="#64748b">Rp₂</text>
  <text x="940" y="295" text-anchor="middle" font-size="7" fill="#64748b">3Rp₂</text>

  <!-- Shallow LDD profile -->
  <path d="M560,270 Q570,200 590,170 Q620,135 660,130 Q700,133 740,150 Q790,190 830,240 Q860,260 880,270" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="660" y="123" text-anchor="middle" font-size="8" fill="#1e40af" font-weight="bold">LDD 轻掺杂漏</text>
  <text x="660" y="135" text-anchor="middle" font-size="7" fill="#3b82f6">低能 ~5 keV, 浅注入</text>
  <line x1="690" y1="136" x2="690" y2="280" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="690" y="288" text-anchor="middle" font-size="7" fill="#3b82f6">Rp₁</text>

  <!-- Deep S/D profile -->
  <path d="M560,270 Q580,230 610,210 Q650,200 710,198 Q780,202 840,220 Q890,245 920,260 Q950,270 970,278" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="780" y="193" text-anchor="middle" font-size="8" fill="#991b1b" font-weight="bold">源漏重掺杂 S/D</text>
  <text x="780" y="205" text-anchor="middle" font-size="7" fill="#ef4444">高能 ~30 keV, 深注入</text>
  <line x1="850" y1="226" x2="850" y2="280" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="850" y="288" text-anchor="middle" font-size="7" fill="#ef4444">Rp₂</text>

  <!-- Rp annotation -->
  <text x="530" y="260" font-size="7" fill="#475569">Np</text>
  <text x="530" y="270" font-size="6" fill="#64748b">峰值↓</text>

  <!-- Wafer cross-section correlation -->
  <rect x="580" y="320" width="350" height="30" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <rect x="580" y="320" width="350" height="10" rx="3" fill="#93c5fd"/>
  <rect x="690" y="320" width="80" height="10" fill="#3b82f6"/>
  <rect x="850" y="320" width="80" height="10" fill="#ef4444"/>
  <rect x="580" y="330" width="350" height="20" fill="#cbd5e1"/>
  <text x="625" y="328" text-anchor="middle" font-size="6" fill="#475569">Si表面</text>
  <text x="730" y="328" text-anchor="middle" font-size="6" fill="#eff6ff">LDD</text>
  <text x="890" y="328" text-anchor="middle" font-size="6" fill="#fef2f2">S/D</text>

  <!-- ==================== PANEL 3: ANNEALING ==================== -->
  <rect x="10" y="375" width="480" height="150" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="10" y="375" width="480" height="30" rx="6" fill="#bbf7d0"/>
  <text x="250" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">③ 退火 (Annealing) — 修复晶格损伤 &amp; 激活杂质</text>

  <!-- Damaged vs Repaired -->
  <text x="25" y="425" font-size="9" fill="#475569" font-weight="bold">注入后 (晶格损伤):</text>
  <rect x="30" y="438" width="140" height="55" rx="4" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
  <rect x="35" y="443" width="60" height="18" rx="2" fill="#e2e8f0"/>
  <circle cx="55" cy="458" r="3" fill="#ef4444"/>
  <circle cx="70" cy="452" r="2" fill="#f87171"/>
  <circle cx="48" cy="448" r="2" fill="#fca5a5"/>
  <circle cx="75" cy="460" r="2" fill="#f87171"/>
  <text x="105" y="452" font-size="6" fill="#991b1b">Si-Si键断裂</text>
  <text x="105" y="462" font-size="6" fill="#991b1b">空位+间隙原子</text>
  <text x="105" y="472" font-size="6" fill="#64748b">杂质未激活</text>

  <!-- Arrow -->
  <text x="195" y="475" font-size="16" fill="#22c55e">→</text>
  <text x="195" y="460" text-anchor="middle" font-size="7" fill="#166534">RTA 快速热退火</text>
  <text x="195" y="470" text-anchor="middle" font-size="7" fill="#166534">900~1100°C, 秒级</text>

  <!-- After annealing -->
  <rect x="230" y="438" width="140" height="55" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <rect x="235" y="443" width="60" height="18" rx="2" fill="#e2e8f0"/>
  <circle cx="255" cy="458" r="3" fill="#22c55e"/>
  <circle cx="270" cy="454" r="2" fill="#4ade80"/>
  <circle cx="248" cy="450" r="2" fill="#86efac"/>
  <circle cx="275" cy="460" r="2" fill="#4ade80"/>
  <text x="305" y="452" font-size="6" fill="#166534">晶格恢复</text>
  <text x="305" y="462" font-size="6" fill="#166534">杂质激活(电活性)</text>
  <text x="305" y="472" font-size="6" fill="#166534">扩散可控</text>
  <text x="345" y="475" font-size="9" fill="#22c55e" font-weight="bold">✓</text>

  <!-- Notes -->
  <text x="30" y="515" font-size="8" fill="#475569">▸ RTA (Rapid Thermal Annealing) 比传统炉管退火扩散小, 浅结工艺的关键</text>

  <!-- ==================== PANEL 4: COMMON IMPLANTS ==================== -->
  <rect x="510" y="375" width="480" height="150" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <rect x="510" y="375" width="480" height="30" rx="6" fill="#e9d5ff"/>
  <text x="750" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b21a8">④ 常见掺杂注入类型</text>

  <!-- NMOS cross-section with 3 implant types -->
  <rect x="520" y="415" width="460" height="100" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Substrate -->
  <rect x="520" y="470" width="460" height="45" fill="#fee2e2"/>

  <!-- Gate -->
  <rect x="700" y="420" width="80" height="22" rx="2" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <text x="740" y="435" text-anchor="middle" font-size="7" fill="#1e293b">多晶硅栅</text>

  <!-- S/D regions -->
  <rect x="670" y="445" width="45" height="25" fill="#3b82f6"/>
  <text x="692" y="462" text-anchor="middle" font-size="6" fill="#eff6ff">N⁺ S/D</text>
  <rect x="765" y="445" width="45" height="25" fill="#3b82f6"/>
  <text x="787" y="462" text-anchor="middle" font-size="6" fill="#eff6ff">N⁺ S/D</text>

  <!-- Halo -->
  <ellipse cx="695" cy="450" rx="15" ry="10" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <ellipse cx="785" cy="450" rx="15" ry="10" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="695" y="498" text-anchor="middle" font-size="6" fill="#92400e">Halo (pocket)</text>
  <text x="785" y="498" text-anchor="middle" font-size="6" fill="#92400e">Halo (pocket)</text>
  <!-- Halo annotation bracket -->
  <line x1="680" y1="492" x2="680" y2="485" stroke="#f59e0b" stroke-width="0.8"/>
  <line x1="710" y1="492" x2="710" y2="485" stroke="#f59e0b" stroke-width="0.8"/>

  <!-- LDD -->
  <rect x="710" y="455" width="30" height="15" fill="#60a5fa" opacity="0.7"/>
  <rect x="740" y="455" width="30" height="15" fill="#60a5fa" opacity="0.7"/>
  <text x="725" y="505" text-anchor="middle" font-size="6" fill="#1e40af">LDD</text>
  <text x="755" y="505" text-anchor="middle" font-size="6" fill="#1e40af">LDD</text>
  <!-- LDD brackets -->
  <line x1="710" y1="475" x2="710" y2="482" stroke="#3b82f6" stroke-width="0.8"/>
  <line x1="740" y1="475" x2="740" y2="482" stroke="#3b82f6" stroke-width="0.8"/>
  <line x1="740" y1="475" x2="740" y2="482" stroke="#3b82f6" stroke-width="0.8"/>
  <line x1="770" y1="475" x2="770" y2="482" stroke="#3b82f6" stroke-width="0.8"/>

  <!-- Vt adjust -->
  <rect x="695" y="452" width="90" height="8" fill="#8b5cf6" opacity="0.4"/>
  <text x="740" y="512" text-anchor="middle" font-size="6" fill="#6d28d9">Vth 阈值调整注入</text>
  <line x1="740" y1="490" x2="740" y2="505" stroke="#8b5cf6" stroke-width="0.8"/>

  <!-- Legend -->
  <text x="530" y="435" font-size="7" fill="#475569" font-weight="bold">注入类型:</text>
  <line x1="530" y1="445" x2="545" y2="445" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="550" y="448" font-size="6" fill="#6d28d9">阈值调整 (浅,低剂量)</text>
  <line x1="630" y1="445" x2="645" y2="445" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="650" y="448" font-size="6" fill="#3b82f6">LDD (轻掺杂漏, 缓解热载流子)</text>
  <line x1="530" y1="456" x2="545" y2="456" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="550" y="459" font-size="6" fill="#b45309">Halo/Pocket (防穿通, 倾角注入)</text>

  <!-- ==================== BOTTOM NOTE ==================== -->
  <rect x="10" y="540" width="980" height="150" rx="6" fill="#0f172a"/>
  <text x="500" y="565" text-anchor="middle" font-size="13" font-weight="bold" fill="#f8fafc">离子注入 vs 高温扩散 — 两种掺杂技术对比</text>
  <text x="500" y="588" text-anchor="middle" font-size="10" fill="#94a3b8">现代工艺（&lt;0.25μm）全部使用离子注入 — 精度高、重复性好、侧向扩散小</text>
  <text x="500" y="610" text-anchor="middle" font-size="9" fill="#64748b">离子注入：精确控制深度+剂量，但会损伤晶格 → 必须退火修复</text>
  <text x="500" y="630" text-anchor="middle" font-size="9" fill="#64748b">高温扩散：无晶格损伤，但各方向扩散不可控 → 不适合纳米级器件</text>
  <text x="500" y="655" text-anchor="middle" font-size="9" fill="#64748b">典型应用：源漏形成 1×10¹⁵ cm⁻² As/30keV → LDD 5×10¹³ cm⁻² As/5keV → Halo BF₂ 5×10¹³ cm⁻²/15keV 35°</text>
  <text x="500" y="678" text-anchor="middle" font-size="9" fill="#64748b">退火关键：RTA 尖峰退火（~1050°C, &lt;1s）+ 后续低温退火 → 高激活率 + 超浅结 (Xj&lt;10nm)</text>
</svg>
