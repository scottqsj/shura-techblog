<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <defs>
    <pattern id="pSub" patternUnits="userSpaceOnUse" width="22" height="22">
      <rect width="22" height="22" fill="#fee2e2"/>
      <circle cx="11" cy="11" r="2" fill="#ef4444" opacity="0.25"/>
    </pattern>
    <linearGradient id="nPlus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1d5db"/><stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="oxideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#f8fafc" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">NMOS 晶体管横截面结构</text>

  <!-- P-substrate -->
  <rect x="40" y="180" width="720" height="175" fill="url(#pSub)" stroke="#fca5a5" stroke-width="1"/>
  <text x="400" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">P 型硅衬底 (P-Substrate)</text>

  <!-- STI -->
  <rect x="40" y="150" width="80" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="2"/>
  <text x="80" y="169" text-anchor="middle" font-size="9" fill="#64748b" font-weight="bold">STI</text>
  <rect x="680" y="150" width="80" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="2"/>
  <text x="720" y="169" text-anchor="middle" font-size="9" fill="#64748b" font-weight="bold">STI</text>

  <!-- N+ Source (embedded in substrate, bottom at y=240) -->
  <rect x="120" y="180" width="110" height="65" fill="url(#nPlus)" rx="2"/>
  <text x="175" y="208" text-anchor="middle" font-size="11" fill="white" font-weight="bold">N⁺ 源极</text>
  <text x="175" y="226" text-anchor="middle" font-size="9" fill="#bfdbfe">Source</text>

  <!-- N+ Drain (embedded in substrate) -->
  <rect x="570" y="180" width="110" height="65" fill="url(#nPlus)" rx="2"/>
  <text x="625" y="208" text-anchor="middle" font-size="11" fill="white" font-weight="bold">N⁺ 漏极</text>
  <text x="625" y="226" text-anchor="middle" font-size="9" fill="#bfdbfe">Drain</text>

  <!-- Gate oxide (on silicon surface between source/drain) -->
  <rect x="230" y="164" width="340" height="16" fill="url(#oxideGrad)" stroke="#7dd3fc" stroke-width="0.8"/>
  <text x="400" y="175" text-anchor="middle" font-size="8" fill="#0284c7" font-weight="bold">栅氧化层 SiO₂</text>

  <!-- Poly gate (on gate oxide) -->
  <rect x="245" y="123" width="310" height="41" fill="url(#gateGrad)" stroke="#b45309" stroke-width="1.2" rx="3"/>
  <text x="400" y="148" text-anchor="middle" font-size="12" fill="#78350f" font-weight="bold">多晶硅栅极 (Poly-Si Gate)</text>

  <!-- Sidewall spacers -->
  <rect x="230" y="135" width="15" height="29" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.5" rx="2"/>
  <rect x="555" y="135" width="15" height="29" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.5" rx="2"/>

  <!-- LDD -->
  <rect x="245" y="195" width="25" height="14" fill="#60a5fa" opacity="0.45" rx="1"/>
  <rect x="530" y="195" width="25" height="14" fill="#60a5fa" opacity="0.45" rx="1"/>

  <!-- Al contact S (flush on top of source, bottom at y=180) -->
  <rect x="135" y="150" width="80" height="30" fill="url(#metalGrad)" stroke="#6b7280" stroke-width="1" rx="2"/>
  <text x="175" y="169" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">铝接触</text>

  <!-- Al contact D (flush on top of drain) -->
  <rect x="585" y="150" width="80" height="30" fill="url(#metalGrad)" stroke="#6b7280" stroke-width="1" rx="2"/>
  <text x="625" y="169" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">铝接触</text>

  <!-- Terminal: S -->
  <line x1="175" y1="150" x2="175" y2="42" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="175" cy="40" r="4" fill="#3b82f6"/>
  <text x="175" y="33" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="bold">S (源极)</text>

  <!-- Terminal: D -->
  <line x1="625" y1="150" x2="625" y2="42" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="625" cy="40" r="4" fill="#3b82f6"/>
  <text x="625" y="33" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="bold">D (漏极)</text>

  <!-- Terminal: G (from gate top y=123, extend upward) -->
  <line x1="400" y1="123" x2="400" y2="52" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="400" cy="50" r="4" fill="#d97706"/>
  <text x="400" y="43" text-anchor="middle" font-size="11" fill="#92400e" font-weight="bold">G (栅极)</text>

  <!-- Depletion / channel region -->
  <rect x="245" y="180" width="310" height="25" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,3" rx="3"/>
  <text x="400" y="198" text-anchor="middle" font-size="9" fill="#ef4444" font-weight="bold">沟道区 (耗尽层 / 反型层)</text>

  <!-- PN junction marks -->
  <line x1="230" y1="250" x2="230" y2="270" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="200" y="283" font-size="8" fill="#f59e0b">PN结</text>
  <line x1="570" y1="250" x2="570" y2="270" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="585" y="283" font-size="8" fill="#f59e0b">PN结</text>

  <!-- Body contact -->
  <rect x="355" y="260" width="90" height="26" fill="#ef4444" rx="3"/>
  <text x="400" y="278" text-anchor="middle" font-size="9" fill="white" font-weight="bold">P⁺ 衬底接触</text>
  <line x1="400" y1="286" x2="400" y2="370" stroke="#ef4444" stroke-width="1.2"/>
  <circle cx="400" cy="373" r="4" fill="#ef4444"/>
  <text x="400" y="389" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="bold">B (衬底)</text>
</svg>