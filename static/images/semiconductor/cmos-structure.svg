<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" font-family="sans-serif">
  <defs>
    <pattern id="pSubP" patternUnits="userSpaceOnUse" width="18" height="18">
      <rect width="18" height="18" fill="#fef2f2"/>
      <circle cx="9" cy="9" r="1.5" fill="#fca5a5" opacity="0.35"/>
    </pattern>
    <pattern id="nWellP" patternUnits="userSpaceOnUse" width="18" height="18">
      <rect width="18" height="18" fill="#eff6ff"/>
      <circle cx="9" cy="9" r="1.5" fill="#93c5fd" opacity="0.35"/>
    </pattern>
    <linearGradient id="pPlusG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="nPlusG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="polyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="oxG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <rect width="860" height="490" fill="#f8fafc" rx="8"/>

  <text x="430" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">CMOS 反相器横截面结构</text>
  <text x="430" y="38" text-anchor="middle" font-size="9" fill="#64748b">NMOS 与 PMOS 互补配对 —— 数字集成电路最基础的逻辑单元</text>

  <!-- ===== BOTTOM = P-SUBSTRATE (full width) ===== -->
  <rect x="20" y="200" width="820" height="200" fill="url(#pSubP)" stroke="#fca5a5" stroke-width="1.2" rx="2"/>
  <text x="680" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">P 型硅衬底 (P-Substrate)</text>

  <!-- ===== N-WELL embedded INSIDE P-substrate (same top surface) ===== -->
  <rect x="20" y="200" width="420" height="160" fill="url(#nWellP)" stroke="#93c5fd" stroke-width="1.2" rx="2"/>
  <text x="230" y="348" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">N 阱 (N-Well)</text>

  <!-- N-well edge annotation -->
  <line x1="440" y1="200" x2="440" y2="360" stroke="#1e40af" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="452" y="290" font-size="7" fill="#1e40af" transform="rotate(-90 452 290)">PN 结隔离</text>

  <!-- ===== STI = all same level, sitting ON silicon surface (y=200) ===== -->
  <!-- Left edge STI -->
  <rect x="20" y="172" width="32" height="28" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8" rx="2"/>
  <text x="36" y="190" text-anchor="middle" font-size="6" fill="#64748b">STI</text>

  <!-- STI between PMOS and NMOS -->
  <rect x="410" y="172" width="32" height="28" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8" rx="2"/>
  <text x="426" y="190" text-anchor="middle" font-size="6" fill="#64748b">STI</text>

  <!-- STI between NMOS and its body contact -->
  <rect x="630" y="172" width="32" height="28" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8" rx="2"/>
  <text x="646" y="190" text-anchor="middle" font-size="6" fill="#64748b">STI</text>

  <!-- Right edge STI -->
  <rect x="808" y="172" width="32" height="28" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8" rx="2"/>

  <!-- ===== PMOS (in N-Well)  ===== -->
  <text x="230" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef4444">PMOS (P 沟道)</text>

  <!-- PMOS P+ Source (embedded in N-well) -->
  <rect x="52" y="200" width="80" height="55" fill="url(#pPlusG)" rx="3"/>
  <text x="92" y="224" text-anchor="middle" font-size="9" fill="white" font-weight="bold">P⁺</text>
  <text x="92" y="242" text-anchor="middle" font-size="7" fill="#fecaca">源极</text>

  <!-- PMOS P+ Drain -->
  <rect x="280" y="200" width="80" height="55" fill="url(#pPlusG)" rx="3"/>
  <text x="320" y="224" text-anchor="middle" font-size="9" fill="white" font-weight="bold">P⁺</text>
  <text x="320" y="242" text-anchor="middle" font-size="7" fill="#fecaca">漏极</text>

  <!-- PMOS Gate Oxide (sits on silicon) -->
  <rect x="132" y="188" width="148" height="12" fill="url(#oxG)" stroke="#7dd3fc" stroke-width="0.5"/>
  <text x="206" y="197" text-anchor="middle" font-size="6" fill="#0284c7">SiO₂ 栅氧化层</text>

  <!-- PMOS Gate -->
  <rect x="138" y="155" width="136" height="33" fill="url(#polyG)" stroke="#b45309" stroke-width="0.8" rx="3"/>
  <text x="206" y="175" text-anchor="middle" font-size="9" fill="#78350f" font-weight="bold">多晶硅栅极</text>

  <!-- PMOS N+ body contact -->
  <rect x="365" y="225" width="40" height="30" fill="url(#nPlusG)" rx="2"/>
  <text x="385" y="243" text-anchor="middle" font-size="7" fill="white" font-weight="bold">N⁺</text>
  <text x="385" y="268" text-anchor="middle" font-size="6" fill="#1d4ed8">B</text>

  <!-- ===== NMOS (in P-Substrate) ===== -->
  <text x="740" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#3b82f6">NMOS (N 沟道)</text>

  <!-- NMOS N+ Source -->
  <rect x="662" y="200" width="80" height="55" fill="url(#nPlusG)" rx="3"/>
  <text x="702" y="224" text-anchor="middle" font-size="9" fill="white" font-weight="bold">N⁺</text>
  <text x="702" y="242" text-anchor="middle" font-size="7" fill="#bfdbfe">源极</text>

  <!-- NMOS N+ Drain -->
  <rect x="778" y="200" width="80" height="55" fill="url(#nPlusG)" rx="3"/>
  <text x="818" y="224" text-anchor="middle" font-size="9" fill="white" font-weight="bold">N⁺</text>
  <text x="818" y="242" text-anchor="middle" font-size="7" fill="#bfdbfe">漏极</text>

  <!-- NMOS Gate Oxide -->
  <rect x="742" y="188" width="36" height="12" fill="url(#oxG)" stroke="#7dd3fc" stroke-width="0.5"/>

  <!-- NMOS Gate -->
  <rect x="744" y="155" width="32" height="33" fill="url(#polyG)" stroke="#b45309" stroke-width="0.8" rx="3"/>
  <text x="760" y="175" text-anchor="middle" font-size="8" fill="#78350f" font-weight="bold">栅极</text>

  <!-- NMOS P+ body contact -->
  <rect x="455" y="260" width="40" height="30" fill="url(#pPlusG)" rx="2"/>
  <text x="475" y="278" text-anchor="middle" font-size="7" fill="white" font-weight="bold">P⁺</text>
  <text x="475" y="300" text-anchor="middle" font-size="6" fill="#b91c1c">B</text>

  <!-- ===== TERMINAL LABELS (S/D/G, no wires, just callouts) ===== -->
  <!-- PMOS S -->
  <line x1="92" y1="200" x2="92" y2="100" stroke="#ef4444" stroke-width="1"/>
  <circle cx="92" cy="97" r="3.5" fill="#ef4444"/>
  <text x="92" y="90" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="bold">S</text>

  <!-- PMOS G -->
  <line x1="206" y1="155" x2="206" y2="100" stroke="#d97706" stroke-width="1"/>
  <circle cx="206" cy="97" r="3.5" fill="#d97706"/>
  <text x="206" y="90" text-anchor="middle" font-size="10" fill="#92400e" font-weight="bold">G</text>

  <!-- PMOS D -->
  <line x1="320" y1="200" x2="320" y2="100" stroke="#ef4444" stroke-width="1"/>
  <circle cx="320" cy="97" r="3.5" fill="#ef4444"/>
  <text x="320" y="90" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="bold">D</text>

  <!-- NMOS S -->
  <line x1="702" y1="200" x2="702" y2="100" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="702" cy="97" r="3.5" fill="#3b82f6"/>
  <text x="702" y="90" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="bold">S</text>

  <!-- NMOS G -->
  <line x1="760" y1="155" x2="760" y2="100" stroke="#d97706" stroke-width="1"/>
  <circle cx="760" cy="97" r="3.5" fill="#d97706"/>
  <text x="760" y="90" text-anchor="middle" font-size="10" fill="#92400e" font-weight="bold">G</text>

  <!-- NMOS D -->
  <line x1="818" y1="200" x2="818" y2="100" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="818" cy="97" r="3.5" fill="#3b82f6"/>
  <text x="818" y="90" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="bold">D</text>

  <!-- ===== I/O ANNOTATIONS ===== -->
  <text x="460" y="75" text-anchor="middle" font-size="11" fill="#92400e" font-weight="bold">Vin 接 PMOS.G 和 NMOS.G</text>
  <text x="580" y="420" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">Vout 取自 PMOS.D 和 NMOS.D</text>

  <!-- ===== TRUTH TABLE (below substrate area, no overlap) ===== -->
  <rect x="180" y="405" width="500" height="80" fill="white" stroke="#e2e8f0" stroke-width="1" rx="5"/>
  <text x="430" y="422" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">工作原理</text>
  <line x1="200" y1="428" x2="660" y2="428" stroke="#e2e8f0" stroke-width="0.5"/>

  <text x="245" y="444" font-size="8" fill="#64748b">Vin = 0 (低)</text>
  <text x="350" y="444" font-size="8" fill="#64748b">→ PMOS 导通，NMOS 截止</text>
  <text x="510" y="444" font-size="8" fill="#ef4444" font-weight="bold">→ Vout = 1 (高)</text>

  <text x="245" y="460" font-size="8" fill="#64748b">Vin = 1 (高)</text>
  <text x="350" y="460" font-size="8" fill="#64748b">→ NMOS 导通，PMOS 截止</text>
  <text x="510" y="460" font-size="8" fill="#3b82f6" font-weight="bold">→ Vout = 0 (低)</text>

  <text x="430" y="478" text-anchor="middle" font-size="7" fill="#94a3b8">任一时刻仅一个管子导通 → 静态功耗几乎为零</text>
</svg>
