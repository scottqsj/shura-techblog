<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">N 型半导体 · P 型半导体</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748b">通过掺杂改变硅的导电类型</text>

  <!-- N-type section -->
  <rect x="30" y="70" width="360" height="320" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="210" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">N 型半导体（掺入 5 价元素 → 磷 P / 砷 As）</text>

  <!-- Si lattice with P dopant -->
  <!-- Si atoms in grid -->
  <circle cx="90" cy="155" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="159" text-anchor="middle" font-size="9" fill="#334155">Si</text>
  <circle cx="180" cy="155" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="159" text-anchor="middle" font-size="9" fill="#334155">Si</text>

  <!-- P dopant -->
  <circle cx="280" cy="155" r="18" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="280" y="156" text-anchor="middle" font-size="9" fill="#92400e">P⁺</text>

  <circle cx="90" cy="230" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="234" text-anchor="middle" font-size="9" fill="#334155">Si</text>
  <circle cx="180" cy="230" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="234" text-anchor="middle" font-size="9" fill="#334155">Si</text>
  <circle cx="280" cy="230" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="234" text-anchor="middle" font-size="9" fill="#334155">Si</text>

  <!-- Bonds between atoms -->
  <line x1="108" y1="155" x2="162" y2="155" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="198" y1="155" x2="262" y2="155" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="90" y1="173" x2="90" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="180" y1="173" x2="180" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="280" y1="173" x2="280" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="108" y1="230" x2="162" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="198" y1="230" x2="262" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Extra electron from P -->
  <circle cx="310" cy="150" r="7" fill="#2563eb" opacity="0.8"/>
  <text x="310" y="153" text-anchor="middle" font-size="8" fill="white">e⁻</text>
  <line x1="298" y1="155" x2="303" y2="152" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="210" y="275" text-anchor="middle" font-size="12" fill="#1e40af">磷有 5 个外层电子，</text>
  <text x="210" y="293" text-anchor="middle" font-size="12" fill="#1e40af">多出的 1 个电子成为自由电子</text>

  <rect x="55" y="310" width="160" height="30" rx="4" fill="#bfdbfe"/>
  <text x="135" y="330" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">多子：电子（负电）</text>
  <rect x="225" y="310" width="140" height="30" rx="4" fill="#e0e7ff"/>
  <text x="295" y="330" text-anchor="middle" font-size="12" fill="#4338ca">少子：空穴</text>

  <!-- P-type section -->
  <rect x="410" y="70" width="360" height="320" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="590" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">P 型半导体（掺入 3 价元素 → 硼 B）</text>

  <!-- Si lattice with B dopant -->
  <circle cx="480" cy="155" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="159" text-anchor="middle" font-size="9" fill="#334155">Si</text>
  <circle cx="570" cy="155" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="570" y="159" text-anchor="middle" font-size="9" fill="#334155">Si</text>

  <!-- B dopant -->
  <circle cx="670" cy="155" r="18" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="670" y="159" text-anchor="middle" font-size="9" fill="#7f1d1d">B³</text>

  <circle cx="480" cy="230" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="234" text-anchor="middle" font-size="9" fill="#334155">Si</text>
  <circle cx="570" cy="230" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="570" y="234" text-anchor="middle" font-size="9" fill="#334155">Si</text>
  <circle cx="670" cy="230" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="670" y="234" text-anchor="middle" font-size="9" fill="#334155">Si</text>

  <!-- Bonds -->
  <line x1="498" y1="155" x2="552" y2="155" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="588" y1="155" x2="652" y2="155" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="480" y1="173" x2="480" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="570" y1="173" x2="570" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="670" y1="173" x2="670" y2="212" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="498" y1="230" x2="552" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="588" y1="230" x2="652" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Hole -->
  <circle cx="697" cy="148" r="7" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,1"/>
  <text x="697" y="151" text-anchor="middle" font-size="7" fill="#ef4444">h⁺</text>
  <line x1="687" y1="155" x2="692" y2="150" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="590" y="275" text-anchor="middle" font-size="12" fill="#991b1b">硼只有 3 个外层电子，</text>
  <text x="590" y="293" text-anchor="middle" font-size="12" fill="#991b1b">缺少的 1 个电子形成"空穴"</text>

  <rect x="435" y="310" width="160" height="30" rx="4" fill="#fecaca"/>
  <text x="515" y="330" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">多子：空穴（正电）</text>
  <rect x="605" y="310" width="140" height="30" rx="4" fill="#fee2e2"/>
  <text x="675" y="330" text-anchor="middle" font-size="12" fill="#b91c1c">少子：电子</text>
</svg>