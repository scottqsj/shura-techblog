<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" font-family="sans-serif">
  <rect width="850" height="520" fill="#f8fafc" rx="8"/>
  <text x="425" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">芯片制造全流程总览</text>
  <text x="425" y="43" text-anchor="middle" font-size="10" fill="#64748b">从一粒沙到一颗芯片 — 数百道工序、耗时 2~3 个月</text>

  <!-- ===== FRONT-END (FEOL) ===== -->
  <rect x="15" y="55" width="820" height="195" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="425" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">前端工艺 (FEOL — Front End of Line)：在硅上制造晶体管</text>

  <!-- Row 1 -->
  <rect x="30" y="88" width="110" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.5"/>
  <text x="85" y="105" text-anchor="middle" font-size="8" font-weight="bold" fill="#1e40af">晶圆准备</text>
  <text x="85" y="118" text-anchor="middle" font-size="7" fill="#3b82f6">硅锭→切片→抛光</text>

  <polygon points="145,108 155,103 145,98" fill="#60a5fa"/>

  <rect x="160" y="88" width="110" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.5"/>
  <text x="215" y="105" text-anchor="middle" font-size="8" font-weight="bold" fill="#1e40af">浅槽隔离 STI</text>
  <text x="215" y="118" text-anchor="middle" font-size="7" fill="#3b82f6">刻槽→填SiO₂→CMP</text>

  <polygon points="275,108 285,103 275,98" fill="#60a5fa"/>

  <rect x="290" y="88" width="110" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.5"/>
  <text x="345" y="105" text-anchor="middle" font-size="8" font-weight="bold" fill="#1e40af">阱注入</text>
  <text x="345" y="118" text-anchor="middle" font-size="7" fill="#3b82f6">N阱/P阱→退火</text>

  <polygon points="405,108 415,103 405,98" fill="#60a5fa"/>

  <rect x="420" y="88" width="110" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.5"/>
  <text x="475" y="105" text-anchor="middle" font-size="8" font-weight="bold" fill="#1e40af">栅极结构</text>
  <text x="475" y="118" text-anchor="middle" font-size="7" fill="#3b82f6">栅氧→多晶硅/金属栅</text>

  <polygon points="535,108 545,103 535,98" fill="#60a5fa"/>

  <rect x="550" y="88" width="120" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="0.5"/>
  <text x="610" y="105" text-anchor="middle" font-size="8" font-weight="bold" fill="#1e40af">源漏掺杂</text>
  <text x="610" y="118" text-anchor="middle" font-size="7" fill="#3b82f6">离子注入→退火激活</text>

  <polygon points="675,108 685,103 675,98" fill="#60a5fa"/>

  <rect x="690" y="88" width="130" height="40" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.5"/>
  <text x="755" y="105" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">晶体管完成！</text>
  <text x="755" y="118" text-anchor="middle" font-size="7" fill="#15803d">单个MOS管物理成形</text>

  <!-- FEOL wafer illustration -->
  <rect x="30" y="140" width="790" height="100" rx="4" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="425" y="155" text-anchor="middle" font-size="9" fill="#475569" font-weight="bold">单个晶体管形成过程（重复数十亿次）</text>

  <!-- Mini cross-sections -->
  <g transform="translate(40,165)">
    <rect x="0" y="0" width="60" height="40" fill="#fef2f2" rx="1"/>
    <text x="30" y="24" text-anchor="middle" font-size="6" fill="#991b1b">P衬底</text>
    <text x="30" y="36" text-anchor="middle" font-size="5" fill="#64748b">基片</text>
  </g>
  <polygon points="105,185 112,180 105,175" fill="#94a3b8"/>

  <g transform="translate(120,165)">
    <rect x="0" y="0" width="60" height="40" fill="#fef2f2" rx="1"/>
    <rect x="5" y="0" width="10" height="8" fill="#e2e8f0"/>
    <rect x="45" y="0" width="10" height="8" fill="#e2e8f0"/>
    <text x="30" y="24" text-anchor="middle" font-size="6" fill="#991b1b">P衬底</text>
    <text x="30" y="36" text-anchor="middle" font-size="5" fill="#64748b">STI隔离</text>
  </g>
  <polygon points="185,185 192,180 185,175" fill="#94a3b8"/>

  <g transform="translate(200,165)">
    <rect x="0" y="0" width="60" height="40" fill="#fef2f2" rx="1"/>
    <rect x="15" y="0" width="30" height="6" fill="#fbbf24"/>
    <rect x="15" y="6" width="30" height="4" fill="#bae6fd"/>
    <text x="30" y="24" text-anchor="middle" font-size="6" fill="#991b1b">沟道</text>
    <text x="30" y="36" text-anchor="middle" font-size="5" fill="#64748b">栅+栅氧</text>
  </g>
  <polygon points="265,185 272,180 265,175" fill="#94a3b8"/>

  <g transform="translate(280,165)">
    <rect x="0" y="0" width="60" height="40" fill="#fef2f2" rx="1"/>
    <rect x="5" y="0" width="12" height="15" fill="#3b82f6"/>
    <rect x="43" y="0" width="12" height="15" fill="#3b82f6"/>
    <rect x="17" y="0" width="26" height="6" fill="#fbbf24"/>
    <rect x="17" y="6" width="26" height="4" fill="#bae6fd"/>
    <text x="30" y="28" text-anchor="middle" font-size="5" fill="white">S/D N⁺</text>
    <text x="30" y="36" text-anchor="middle" font-size="5" fill="#64748b">源漏掺杂</text>
  </g>
  <polygon points="345,185 352,180 345,175" fill="#94a3b8"/>

  <g transform="translate(360,165)">
    <rect x="0" y="0" width="60" height="40" fill="#fef2f2" rx="1"/>
    <rect x="5" y="0" width="12" height="15" fill="#3b82f6"/>
    <rect x="43" y="0" width="12" height="15" fill="#3b82f6"/>
    <rect x="17" y="0" width="26" height="8" fill="#fbbf24"/>
    <rect x="17" y="8" width="26" height="4" fill="#bae6fd"/>
    <rect x="10" y="20" width="40" height="15" fill="#9ca3af"/>
    <text x="30" y="32" text-anchor="middle" font-size="5" fill="white">接触孔</text>
    <text x="30" y="38" text-anchor="middle" font-size="5" fill="#64748b">金属接触</text>
  </g>

  <text x="530" y="195" font-size="8" fill="#64748b">← 反复进行光刻→刻蚀→沉积→掺杂循环 →</text>

  <!-- ===== BACK-END (BEOL) ===== -->
  <rect x="15" y="260" width="820" height="120" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="425" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">后端工艺 (BEOL — Back End of Line)：构建多层金属互连</text>

  <!-- BEOL steps -->
  <rect x="30" y="292" width="100" height="35" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
  <text x="80" y="308" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400e">沉积层间介质</text>
  <text x="80" y="321" text-anchor="middle" font-size="7" fill="#a16207">CVD SiO₂ / low-k</text>

  <polygon points="135,310 145,305 135,300" fill="#f59e0b"/>

  <rect x="150" y="292" width="100" height="35" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
  <text x="200" y="308" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400e">光刻通孔/沟槽</text>
  <text x="200" y="321" text-anchor="middle" font-size="7" fill="#a16207">双大马士革</text>

  <polygon points="255,310 265,305 255,300" fill="#f59e0b"/>

  <rect x="270" y="292" width="100" height="35" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
  <text x="320" y="308" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400e">PVD 阻挡层/籽晶</text>
  <text x="320" y="321" text-anchor="middle" font-size="7" fill="#a16207">TaN/Ta + Cu Seed</text>

  <polygon points="375,310 385,305 375,300" fill="#f59e0b"/>

  <rect x="390" y="292" width="100" height="35" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
  <text x="440" y="308" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400e">电镀铜填充</text>
  <text x="440" y="321" text-anchor="middle" font-size="7" fill="#a16207">ECD</text>

  <polygon points="495,310 505,305 495,300" fill="#f59e0b"/>

  <rect x="510" y="292" width="100" height="35" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
  <text x="560" y="308" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400e">CMP 平坦化</text>
  <text x="560" y="321" text-anchor="middle" font-size="7" fill="#a16207">去除多余铜</text>

  <polygon points="615,310 625,305 615,300" fill="#94a3b8"/>

  <text x="640" y="315" font-size="8" fill="#64748b">↻ 重复 5~15 层金属</text>

  <rect x="700" y="292" width="120" height="35" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.5"/>
  <text x="760" y="308" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">钝化层保护</text>
  <text x="760" y="321" text-anchor="middle" font-size="7" fill="#15803d">Si₃N₄ 顶层保护</text>

  <!-- BEOL illustration -->
  <rect x="30" y="335" width="790" height="36" rx="2" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  <!-- Stack -->
  <rect x="120" y="340" width="120" height="26" fill="#fef2f2" rx="1"/>
  <text x="180" y="357" text-anchor="middle" font-size="6" fill="#991b1b">P-Sub &amp; 晶体管</text>

  <rect x="120" y="325" width="120" height="15" fill="#fef3c7" rx="1"/>
  <text x="180" y="335" text-anchor="middle" font-size="5" fill="#92400e">M0 (Contact)</text>

  <rect x="120" y="310" width="120" height="15" fill="#fef3c7" rx="1"/>
  <text x="180" y="320" text-anchor="middle" font-size="5" fill="#92400e">M1 (Metal1)</text>

  <rect x="120" y="295" width="120" height="15" fill="#fef3c7" rx="1"/>
  <text x="180" y="305" text-anchor="middle" font-size="5" fill="#92400e">M2</text>

  <rect x="120" y="280" width="120" height="15" fill="#fef3c7" rx="1"/>
  <text x="180" y="290" text-anchor="middle" font-size="5" fill="#92400e">M3</text>

  <rect x="120" y="265" width="120" height="15" fill="#fef3c7" rx="1"/>
  <text x="180" y="275" text-anchor="middle" font-size="5" fill="#92400e">M4 (顶层)</text>

  <text x="280" y="340" font-size="7" fill="#64748b">← 层间用 Via (通孔) 连接 →</text>
  <text x="500" y="355" font-size="8" fill="#64748b">M0~M1 局部互连 · M2~M4 全局互连 · 顶层最厚(供电)</text>

  <!-- ===== TESTING & PACKAGING ===== -->
  <rect x="15" y="392" width="820" height="115" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="425" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">测试与封装 (Testing &amp; Packaging)</text>

  <rect x="40" y="422" width="140" height="40" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.5"/>
  <text x="110" y="439" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">晶圆级测试</text>
  <text x="110" y="454" text-anchor="middle" font-size="7" fill="#15803d">探针卡逐颗检测</text>

  <polygon points="185,442 195,437 185,432" fill="#4ade80"/>

  <rect x="200" y="422" width="110" height="40" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.5"/>
  <text x="255" y="439" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">切割划片</text>
  <text x="255" y="454" text-anchor="middle" font-size="7" fill="#15803d">金刚石刀分离</text>

  <polygon points="315,442 325,437 315,432" fill="#4ade80"/>

  <rect x="330" y="422" width="110" height="40" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.5"/>
  <text x="385" y="439" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">芯片贴装</text>
  <text x="385" y="454" text-anchor="middle" font-size="7" fill="#15803d">固晶到引线框架</text>

  <polygon points="445,442 455,437 445,432" fill="#4ade80"/>

  <rect x="460" y="422" width="110" height="40" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.5"/>
  <text x="515" y="439" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">引线键合</text>
  <text x="515" y="454" text-anchor="middle" font-size="7" fill="#15803d">金/铜线连接</text>

  <polygon points="575,442 585,437 575,432" fill="#4ade80"/>

  <rect x="590" y="422" width="110" height="40" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.5"/>
  <text x="645" y="439" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">塑封</text>
  <text x="645" y="454" text-anchor="middle" font-size="7" fill="#15803d">环氧树脂包裹</text>

  <polygon points="705,442 715,437 705,432" fill="#4ade80"/>

  <rect x="720" y="422" width="100" height="40" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="770" y="439" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">终测出货</text>
  <text x="770" y="454" text-anchor="middle" font-size="7" fill="#15803d">FT + 包装</text>

  <text x="425" y="500" text-anchor="middle" font-size="9" fill="#475569">一片 300mm 晶圆 → 数百道工序 → 数千颗裸片 (Die) → 合格品 → 手机/电脑/汽车里</text>
</svg>